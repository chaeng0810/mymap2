        }
    </style>

    <script>
        /**
         * 추구미 스카 찾기 메인 자바스크립트 로직
         * - Kakao Map API 안전 제어
         * - Geolocation 기반 현재 위치 산출
         * - 4가지 조건 가중치 알고리즘 구현
         */

        // 전역 상태 변수
        let mapInstance = null;         // Map 객체
        let userMarkerOverlay = null;   // 사용자 현재 위치 마커
        let activeInfoWindow = null;    // 현재 열린 인포윈도우
        let mapMarkers = [];            // 생성된 마커 객체 배열

        // 위치 기본값 (위치 권한 거부 시 서울시청)
        let currentUserPos = {
            lat: 37.5665,
            lng: 126.9780
        };

        // 스터디카페 가상 고품질 샘플 데이터셋
        const mockCafeData = [
            {
                id: 1,
                name: "시그니처 몰입 스터디카페",
                lat: 37.5672,
                lng: 126.9792,
                address: "서울 중구 태평로1가 12-3 3층",
                pricePerHour: 1600,
                rating: 4.9,
                foodScore: 9.5,
                image: "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=300&q=80",
                tags: ["24h 전용", "무소음키보드존", "스타벅스원두"]
            },
            {
                id: 2,
                name: "포커스 라운지 스카",
                lat: 37.5651,
                lng: 126.9755,
                address: "서울 중구 서소문로 45 2층",
                pricePerHour: 1200,
                rating: 4.4,
                foodScore: 6.5,
                image: "https://images.unsplash.com/photo-1527192491265-7e15c55b1ed2?auto=format&fit=crop&w=300&q=80",
                tags: ["가성비최강", "넓은독서대", "산소발생기"]
            },
            {
                id: 3,
                name: "더 스투디움 프리미엄",
                lat: 37.5690,
                lng: 126.9768,
                address: "서울 종로구 종로1가 22 4층",
                pricePerHour: 2200,
                rating: 4.95,
                foodScore: 9.8,
                image: "https://images.unsplash.com/photo-1517502884422-41eaead166d4?auto=format&fit=crop&w=300&q=80",
                tags: ["초고속Wi-Fi6", "무료프린트", "맛집골목"]
            },
            {
                id: 4,
                name: "그린에코 스터디랩",
                lat: 37.5642,
                lng: 126.9810,
                address: "서울 중구 명동길 15 3층",
                pricePerHour: 1100,
                rating: 4.2,
                foodScore: 8.2,
                image: "https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=300&q=80",
                tags: ["조용한환경", "자유석", "시티뷰"]
            },
            {
                id: 5,
                name: "어반워크 스터디 아카데미",
                lat: 37.5685,
                lng: 126.9825,
                address: "서울 종로구 삼일대로 10 5층",
                pricePerHour: 1800,
                rating: 4.7,
                foodScore: 7.5,
                image: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=300&q=80",
                tags: ["노트북존", "카페테리아", "깨끗한위생"]
            }
        ];

        // 페이지 로드 시 Kakao Map 안전 초기화
        window.onload = function() {
            if (typeof kakao !== 'undefined' && kakao.maps) {
                kakao.maps.load(function() {
                    initializeMap();
                    setupEventListeners();
                });
            } else {
                showToast("카카오 지도 SDK 로드에 실패했습니다.");
            }
        };

        /**
         * 지도 초기화
         */
        function initializeMap() {
            const container = document.getElementById('map');
            const options = {
                center: new kakao.maps.LatLng(currentUserPos.lat, currentUserPos.lng),
                level: 7 // 요구조건: 확대 레벨 7
            };

            mapInstance = new kakao.maps.Map(container, options);

            // 줌 컨트롤 추가
            const zoomControl = new kakao.maps.ZoomControl();
            mapInstance.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

            // 현재 위치 확인
            fetchUserCurrentLocation();
        }

        /**
         * 현재 위치 탐색 (Geolocation)
         */
        function fetchUserCurrentLocation() {
            if (navigator.geolocation) {
                showToast("현재 위치를 확인 중입니다...");

                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        currentUserPos.lat = position.coords.latitude;
                        currentUserPos.lng = position.coords.longitude;

                        const latLng = new kakao.maps.LatLng(currentUserPos.lat, currentUserPos.lng);

                        mapInstance.setCenter(latLng);
                        mapInstance.setLevel(7);

                        renderUserLocationMarker(latLng);
                        showToast("현재 위치가 중심으로 설정되었습니다.");
                        updateRecommendations();
                    },
                    function(error) {
                        showToast("위치 권한을 불러올 수 없어 기본 위치로 설정합니다.");
                        const latLng = new kakao.maps.LatLng(currentUserPos.lat, currentUserPos.lng);
                        renderUserLocationMarker(latLng);
                        updateRecommendations();
                    },
                    { enableHighAccuracy: true, timeout: 6000 }
                );
            } else {
                showToast("이 브라우저는 위치 서비스를 지원하지 않습니다.");
                updateRecommendations();
            }
        }

        /**
         * 내 위치 맞춤형 네온 마커 생성
         */
        function renderUserLocationMarker(latLng) {
            if (userMarkerOverlay) {
                userMarkerOverlay.setMap(null);
            }

            const element = document.createElement('div');
            element.className = 'relative flex items-center justify-center';
            element.innerHTML = `
                <span class="animate-ping absolute inline-flex h-9 w-9 rounded-full bg-indigo-500 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-7 w-7 bg-indigo-600 border-2 border-white items-center justify-center text-white text-[11px] font-extrabold shadow-glow">
                    ME
                </span>
            `;

            userMarkerOverlay = new kakao.maps.CustomOverlay({
                position: latLng,
                content: element,
                xAnchor: 0.5,
                yAnchor: 0.5
            });

            userMarkerOverlay.setMap(mapInstance);
        }

        /**
         * 두 위경도 좌표 간 직선 거리(km) 수식
         */
        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        /**
         * 가중치 슬라이더 상태 반영 및 매칭 알고리즘 수식
         */
        function updateRecommendations() {
            // 슬라이더 입력값 가져오기 (1~10)
            const wDistance = parseFloat(document.getElementById('distanceWeight').value);
            const wRating = parseFloat(document.getElementById('ratingWeight').value);
            const wPrice = parseFloat(document.getElementById('priceWeight').value);
            const wFood = parseFloat(document.getElementById('foodWeight').value);

            const calculatedCafes = mockCafeData.map(cafe => {
                const distKm = calculateDistanceKm(currentUserPos.lat, currentUserPos.lng, cafe.lat, cafe.lng);
                
                // 각 항목별 점수 변환 (10점 만점 기준)
                const distanceScore = Math.max(0, 10 - (distKm * 2.2));
                const ratingScore = (cafe.rating / 5) * 10;
                const priceScore = Math.max(0, 10 - ((cafe.pricePerHour - 1000) / 120));
                const foodScore = cafe.foodScore;

                const totalWeight = wDistance + wRating + wPrice + wFood;
                const weightedSum = (distanceScore * wDistance) + 
                                    (ratingScore * wRating) + 
                                    (priceScore * wPrice) + 
                                    (foodScore * wFood);

                const matchPercentage = Math.min(99, Math.max(60, Math.round((weightedSum / (totalWeight * 10)) * 100)));

                return {
                    ...cafe,
                    distanceKm: distKm.toFixed(1),
                    matchPercentage: matchPercentage
                };
            });

            // 매칭 점수 순 정렬
            calculatedCafes.sort((a, b) => b.matchPercentage - a.matchPercentage);

            // UI 및 지도 마커 동기화
            renderCafeList(calculatedCafes);
            renderMapMarkers(calculatedCafes);
        }

        /**
         * 세련된 카드 목록 렌더링
         */
        function renderCafeList(cafes) {
            const listContainer = document.getElementById('cafeList');
            document.getElementById('resultCount').textContent = cafes.length;

            listContainer.innerHTML = '';

            cafes.forEach((cafe, index) => {
                const isTopRank = index === 0;

                const card = document.createElement('div');
                card.className = `glass-card p-4 rounded-2xl cursor-pointer group shadow-sm hover:shadow-card-hover ${
                    isTopRank ? 'border-2 border-indigo-500/80 ring-4 ring-indigo-500/10' : 'hover:border-indigo-300'
                }`;

                card.innerHTML = `
                    <div class="flex gap-3.5">
                        <!-- 이미지 크롭 스퀘어 -->
                        <div class="w-20 h-20 rounded-xl overflow-hidden relative shrink-0 bg-slate-200">
                            <img src="${cafe.image}" alt="${cafe.name}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                            ${isTopRank ? '<span class="absolute top-1 left-1 bg-indigo-600 text-white text-[9px] font-black px-1.5 py-0.5 rounded-md shadow">BEST</span>' : ''}
                        </div>

                        <!-- 스카 정보 및 매칭률 -->
                        <div class="flex-1 min-w-0">
                            <div class="flex items-start justify-between gap-1">
                                <h3 class="font-bold text-slate-900 text-sm truncate group-hover:text-indigo-600 transition-colors">
                                    ${cafe.name}
                                </h3>
                                <!-- 매칭 퍼센트 뱃지 -->
                                <span class="shrink-0 font-extrabold text-xs px-2 py-1 rounded-lg ${
                                    isTopRank ? 'bg-indigo-600 text-white shadow-glow' : 'bg-indigo-50 text-indigo-600'
                                }">
                                    ${cafe.matchPercentage}%
                                </span>
                            </div>

                            <p class="text-[11px] text-slate-500 mt-1 truncate">
                                <i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${cafe.address}
                            </p>

                            <!-- 핵심 지표 태그 -->
                            <div class="flex items-center gap-2 mt-2.5 text-[11px] font-semibold text-slate-600">
                                <span class="flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded-md">
                                    <i class="fa-solid fa-person-walking text-sky-500"></i> ${cafe.distanceKm}km
                                </span>
                                <span class="flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded-md">
                                    <i class="fa-solid fa-star text-amber-500"></i> ${cafe.rating}
                                </span>
                                <span class="flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded-md">
                                    ${cafe.pricePerHour.toLocaleString()}원/시간
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- 태그 리스트 -->
                    <div class="flex flex-wrap gap-1 mt-3 pt-2.5 border-t border-slate-100">
                        ${cafe.tags.map(t => `<span class="text-[10px] font-medium text-slate-500 bg-slate-100/80 px-2 py-0.5 rounded-full">#${t}</span>`).join('')}
                    </div>
                `;

                // 카드 클릭 시 해당 지도 위치로 소프트 이동
                card.addEventListener('click', () => {
                    focusCafeOnMap(cafe);
                });

                listContainer.appendChild(card);
            });
        }

        /**
         * 지도 내 고화질 마커 및 클릭 인포윈도우 렌더링
         */
        function renderMapMarkers(cafes) {
            mapMarkers.forEach(m => m.setMap(null));
            mapMarkers = [];

            cafes.forEach((cafe) => {
                const position = new kakao.maps.LatLng(cafe.lat, cafe.lng);

                const marker = new kakao.maps.Marker({
                    position: position,
                    map: mapInstance,
                    title: cafe.name
                });

                // 커스텀 흑단색 인포윈도우 디자인
                const iwContent = `
                    <div class="custom-infowindow">
                        <div class="font-bold text-sm text-white mb-1">${cafe.name}</div>
                        <div class="text-indigo-400 font-extrabold text-xs mb-1">추구미 적합도 ${cafe.matchPercentage}%</div>
                        <div class="text-slate-300 text-[11px]">
                            ★ ${cafe.rating} | ${cafe.pricePerHour.toLocaleString()}원/h | ${cafe.distanceKm}km
                        </div>
                    </div>
                `;

                const infoWindow = new kakao.maps.InfoWindow({
                    content: iwContent,
                    removable: true
                });

                kakao.maps.event.addListener(marker, 'click', function() {
                    if (activeInfoWindow) activeInfoWindow.close();
                    infoWindow.open(mapInstance, marker);
                    activeInfoWindow = infoWindow;
                });

                mapMarkers.push(marker);
            });
        }

        /**
         * 선택한 카드로 지도를 이동시키는 함수
         */
        function focusCafeOnMap(cafe) {
            const moveLatLng = new kakao.maps.LatLng(cafe.lat, cafe.lng);
            mapInstance.panTo(moveLatLng);

            const cafeIndex = mockCafeData.findIndex(c => c.id === cafe.id);
            if (cafeIndex !== -1 && mapMarkers[cafeIndex]) {
                kakao.maps.event.trigger(mapMarkers[cafeIndex], 'click');
            }
        }

        /**
         * 이벤트 리스너 바인딩 및 슬라이더 트랙 동적 색상 채우기
         */
        function setupEventListeners() {
            const sliderConfigs = [
                { id: 'distanceWeight', valId: 'distanceWeightVal' },
                { id: 'ratingWeight', valId: 'ratingWeightVal' },
                { id: 'priceWeight', valId: 'priceWeightVal' },
                { id: 'foodWeight', valId: 'foodWeightVal' }
            ];

            sliderConfigs.forEach(cfg => {
                const slider = document.getElementById(cfg.id);
                const valDisplay = document.getElementById(cfg.valId);

                // 트랙 컬러 업데이트 로직
                const updateTrackColor = (elem) => {
                    const percentage = ((elem.value - elem.min) / (elem.max - elem.min)) * 100;
                    elem.style.background = `linear-gradient(to right, #6366f1 0%, #6366f1 ${percentage}%, #e2e8f0 ${percentage}%, #e2e8f0 100%)`;
                };

                updateTrackColor(slider);

                slider.addEventListener('input', (e) => {
                    valDisplay.textContent = e.target.value;
                    updateTrackColor(e.target);
                    updateRecommendations();
                });
            });

            // 내 위치 버튼 이벤트
            document.getElementById('resetLocationBtn').addEventListener('click', () => {
                fetchUserCurrentLocation();
            });
        }

        /**
         * 하단 알림 토스트 UI 함수
         */
        function showToast(message) {
            const toast = document.getElementById('toastMessage');
            const toastText = document.getElementById('toastText');

            toastText.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2');
            }, 3000);
        }
    </script>
</body>
</html>
